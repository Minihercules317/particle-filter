# Pushing a tag like v1.2.0 builds a jar for every Minecraft version and loader and publishes the GitHub release.
# If the CURSEFORGE_TOKEN repository secret is set, the jars are also uploaded to CurseForge
# (scripts/publish-curseforge.sh); without it, that step is skipped and the upload stays manual.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the mod version
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"/\1/p' stonecutter.properties.toml)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match mod.version $version in stonecutter.properties.toml" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: ./gradlew build buildAndCollect

      - name: Write release notes
        run: |
          changelog=$(awk -v v="$VERSION" '$0 == "## " v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md | sed '/./,$!d')
          if [[ -z $changelog ]]; then
            echo "CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          fi
          {
            printf '%s\n\n' "$changelog"
            echo "> **AI disclosure:** the code for this mod was written by Claude, an AI model by Anthropic. Minihercules317 contributed the idea, design decisions, in-game testing, the screenshots and recordings, and the hand-drawn icon, not the code. See the README's [Who did what](https://github.com/Minihercules317/particle-filter#who-did-what) section."
            echo
            echo "**Install:** put the jar for your Minecraft version and loader in your \`mods\` folder (client only), replacing any older version:"
            echo
            for jar in build/libs/$VERSION/*.jar; do
              name=$(basename "$jar")
              # particlefilter-<loader>-<version>+<mc>.jar
              loader=${name#particlefilter-}; loader=${loader%%-*}
              mc=${name##*+}; mc=${mc%.jar}
              case $loader in
                neoforge) loader_name=NeoForge ;;
                forge) loader_name=Forge ;;
                *) loader_name=$loader ;;
              esac
              echo "- Minecraft $mc, $loader_name: \`$name\`"
            done
            echo
            echo "SHA-256:"
            echo
            for jar in build/libs/$VERSION/*.jar; do
              echo "- \`$(basename "$jar")\`: \`$(sha256sum "$jar" | cut -d' ' -f1)\`"
            done
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/$VERSION/*.jar \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: particlefilter-jars
          # Only build/libs/<version>/ exists in CI; the CurseForge job restores it as is.
          path: build/libs/

  curseforge:
    needs: github-release
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Skip without a CurseForge token
        if: env.CURSEFORGE_TOKEN == ''
        run: echo "CURSEFORGE_TOKEN secret not set; upload to CurseForge manually with scripts/publish-curseforge.sh."
      - uses: actions/checkout@v4
        if: env.CURSEFORGE_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.CURSEFORGE_TOKEN != ''
        with:
          name: particlefilter-jars
          path: build/libs/
      - name: Upload to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        run: |
          # The script reads the token from a file, so it never appears on a command line.
          token_file=$(mktemp)
          printf '%s' "$CURSEFORGE_TOKEN" > "$token_file"
          CURSEFORGE_TOKEN_FILE=$token_file scripts/publish-curseforge.sh
          rm -f "$token_file"
