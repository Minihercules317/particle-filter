# Pushing a tag like v1.2.0 builds the jar and publishes the GitHub release.
# If the CURSEFORGE_TOKEN repository secret is set, the jar is also uploaded to CurseForge
# (scripts/publish-curseforge.sh); without it, that step is skipped and the upload stays manual.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches build.gradle
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match build.gradle version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: ./gradlew build

      - name: Write release notes
        run: |
          jar=particlefilter-$VERSION.jar
          sha=$(sha256sum "build/libs/$jar" | cut -d' ' -f1)
          changelog=$(awk -v v="$VERSION" '$0 == "## " v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md | sed '/./,$!d')
          if [[ -z $changelog ]]; then
            echo "CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          fi
          {
            printf '%s\n\n' "$changelog"
            echo "> **AI disclosure:** the code for this mod was written by Claude, an AI model by Anthropic. Minihercules317 contributed the idea, design decisions, in-game testing, the screenshots and recordings, and the hand-drawn icon, not the code. See the README's [Who did what](https://github.com/Minihercules317/particle-filter#who-did-what) section."
            echo
            echo "**Install:** put \`$jar\` in your \`mods\` folder (client only; Minecraft 1.21.1, NeoForge 21.1+), replacing any older version."
            echo
            echo "SHA-256 of \`$jar\`: \`$sha\`"
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/libs/particlefilter-$VERSION.jar" \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: particlefilter-jar
          path: build/libs/particlefilter-${{ env.VERSION }}.jar

  curseforge:
    needs: github-release
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Skip without a CurseForge token
        if: env.CURSEFORGE_TOKEN == ''
        run: echo "CURSEFORGE_TOKEN secret not set; upload to CurseForge manually with scripts/publish-curseforge.sh."
      - uses: actions/checkout@v4
        if: env.CURSEFORGE_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.CURSEFORGE_TOKEN != ''
        with:
          name: particlefilter-jar
          path: build/libs
      - name: Upload to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        run: |
          # The script reads the token from a file, so it never appears on a command line.
          token_file=$(mktemp)
          printf '%s' "$CURSEFORGE_TOKEN" > "$token_file"
          CURSEFORGE_TOKEN_FILE=$token_file scripts/publish-curseforge.sh
          rm -f "$token_file"
