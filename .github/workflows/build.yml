# Builds the mod for every Minecraft version and loader on each push and pull request to main, so a broken build
# shows up before a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Forge 1.20.1 builds with Java 17, NeoForge 1.21.1 with 21.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build buildAndCollect
      - uses: actions/upload-artifact@v4
        with:
          name: particlefilter-jar
          path: build/libs/*/particlefilter-*.jar
