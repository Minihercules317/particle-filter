modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "pfbench"
version = "${version}"
displayName = "pfbench (Particle Filter benchmark harness)"
authors = "Claude by Anthropic (code), Minihercules317 (design review)"
credits = "Benchmark-only harness. Code written by Claude (Anthropic's AI model) via Claude Code."
description = '''
Benchmark-only harness for Particle Filter's synthetic benchmarks (benchmarks/HARNESS.md). Spawns a fixed particle
workload, runs a scripted phase plan, and logs frame times and particle counters. Never shipped to players.
'''

[[dependencies.pfbench]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pfbench]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "CLIENT"

# Present in configurations B/C/D only; reached by reflection.
[[dependencies.pfbench]]
modId = "particlefilter"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
