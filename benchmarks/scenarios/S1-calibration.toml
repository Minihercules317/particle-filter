# S1-calibration: EXPLORATORY calibration copy of S1 (PLAN.md §7 phase 3). Identical to S1-synthetic.toml except
# [scenario] id and the levels table: log-spaced target attempts per tick for the calibration sweep.
# Data from this scenario is calibration data, never an official result. Its scenario hash differs from S1's, so
# compare.py never pairs it with campaign data. Original header follows.
# S1: controlled synthetic particle workload (draft). Read by benchmarks/harness/pfbench.py, which turns it into the
# plan.json the pfbench harness executes.
# Values marked "provisional" are replaced after the calibration sweep (PLAN.md §7, phase 3).
# Any change after a campaign starts makes a new scenario version; campaigns record the hash of this file.

[scenario]
id = "S1-calibration"
version = 1
minecraft = "1.21.1"
loader = "neoforge-21.1.250"
description = "Fixed-lifetime particles from a fixed emitter grid in front of a locked camera, in a void world."

[world]
template = "pfbench"            # level name; Particle Filter zones in configs/ use this as their world
preset = "minecraft:the_void"   # flat void preset: nothing to render but the platform and the particles
seed = 20261109
spawn = [0, 100, 0]
gamerules = { doDaylightCycle = false, doWeatherCycle = false, doMobSpawning = false, randomTickSpeed = 0 }
time = 6000
weather = "clear"
fresh_copy_per_launch = true

[camera]
position = [0.5, 102.38, 0.5]   # eye at y 104.0 (spectator eye height 1.62), the centre of the emitter plane
yaw = 0.0          # facing +Z (south), toward the emitter plane
pitch = 0.0
gamemode = "spectator"
hide_hud = true    # F1

[options]          # written to options.txt of the run directory before launch
renderDistance = 8
simulationDistance = 5
maxFps = 260       # 260 = unlimited
enableVsync = false
particles = 0      # All
graphicsMode = 1   # Fancy
fullscreen = true  # on DP-1 (NVIDIA-attached), 2560x1440@240
ao = true
renderClouds = "false"   # clouds off, so they don't add rendering cost
fov = 70           # degrees (vertical); pfbench.py writes Minecraft's stored form
pauseOnLostFocus = false       # an unfocused window must not open the pause menu (it would pause the world)
onboardAccessibility = false   # skip the first-launch accessibility screen
soundCategory_master = 0.0

[emitters]
plane_z = 14.0
x_range = [-8.0, 8.0]
y_range = [96.0, 112.0]
grid = 16          # 16 x 16 points; jitter from java.util.Random(seed)
velocity = [0.0, 0.0, 0.0]

[particles.target]
type = "pfbench:target"
lifetime_ticks = 40
render_type = "PARTICLE_SHEET_OPAQUE"

[particles.control]
type = "pfbench:control"
lifetime_ticks = 40
render_type = "PARTICLE_SHEET_TRANSLUCENT"   # separate 16,384 queue from the target
attempts_per_tick = 25                        # constant at every level
plane_z_offset = 1.0                          # one block behind the target plane, so the two never share a depth

[levels]           # target attempts per tick: log-spaced calibration sweep (EXPLORATORY)
idle = 0
l5 = 5
l10 = 10
l20 = 20
l50 = 50
l100 = 100
l200 = 200
l410 = 410
l1000 = 1000
l2000 = 2000
l5000 = 5000

[variants]
typed = "pfbench:target via ClientLevel.addParticle"
untyped = "pfbench.UntypedParticle constructed by the harness, ParticleEngine.add"
block_dust = "minecraft:block with minecraft:stone via ClientLevel.addParticle"
vanilla = "minecraft:end_rod via ClientLevel.addParticle (random lifetime; live counts logged)"

[phases]           # seconds (provisional until the variance study)
settle_after_load = 20
warmup_with_workload = 60
settle_after_switch = 15      # >= longest particle life + 2 ticks (pfbench.py refuses shorter); also lets the JIT settle
measure = 30
cooldown_between_launches = 60
gc_at_switch = true           # System.gc() when each settle starts: each window begins from a similar heap, and the
                              # previous configuration's garbage is collected outside the measured window
# The warmup runs every configuration of a launch round-robin (two rounds), in its own mode, so no configuration's
# code path is first compiled during another one's measurement.

[modsets]          # rendering mods present in EVERY configuration of a comparison (pfbench.py --modset)
vanilla = "none"
sodium = "Sodium 0.8.13 + Sodium Extra 0.9.5 (pinned by SHA-256 in pfbench.py), configs from configs/sodium/"

[configs]
# Mode switches inside one launch use configs/pf-synthetic.json (generated by tools/make_pf_config.py).
A = "Particle Filter not installed"
B = "pf-synthetic.json, mode NONE"
C = "pf-synthetic.json, mode EVERYWHERE"
D = "pf-synthetic.json, mode ZONES"
C-miss = "make_pf_config.py miss --count 10"
C-rules-N = "make_pf_config.py rules --count N  (N = 1, 10, 100, 1000)"
E = "Particle Filter not installed; Sodium Extra hides the target type (needs --modset sodium, typed/vanilla only)"
D-zones-N = "make_pf_config.py zones --count N  (N = 1, 10, 100)"

[jvm]
args = "-Xms4G -Xmx4G -XX:+UseG1GC -Xlog:gc*:file=gc.log:time,uptime,level,tags"
