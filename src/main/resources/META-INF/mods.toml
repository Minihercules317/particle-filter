modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Minihercules317/particle-filter/issues"

[[mods]]
modId = "particlefilter"
version = "${version}"
displayName = "Particle Filter"
logoFile = "particlefilter.png"
logoBlur = false
authors = "Minihercules317 (idea, design, testing), Claude by Anthropic (code)"
displayURL = "https://github.com/Minihercules317/particle-filter"
credits = "Code written by Claude (Anthropic's AI model) via Claude Code. Idea, design decisions and testing by Minihercules317."
description = '''
Too many particles, or particles hurting your FPS? Scan to find out exactly which ones are on screen, then hide just those: everywhere, only inside areas you choose, or for specific blocks' breaking and mining effects. Works with vanilla and modded particles. Client-side only; open the menu with /particles.

AI disclosure: this mod's code was written by an AI (Claude, by Anthropic). Minihercules317 contributed the idea, design decisions and testing, not the code.
'''

# NeoForge reads this; Forge 1.20.1 loads mixins from the jar manifest instead.
[[mixins]]
config = "particlefilter.mixins.json"

[[dependencies.particlefilter]]
modId = "${loader}"
${required}
versionRange = "${loader_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.particlefilter]]
modId = "minecraft"
${required}
versionRange = "${mc_range}"
ordering = "NONE"
side = "CLIENT"
